# Banques de noms pour la generation du catalogue synthetique de praticiens (§7).
#
# Toutes ces personnes sont fictives. Les categories ne sont pas decoratives :
# chacune correspond a une difficulte que le routeur et le resolveur doivent
# affronter separement — accents, apostrophes, noms composes, homophones, formes
# que la reconnaissance vocale abime de maniere previsible.

version: 1

