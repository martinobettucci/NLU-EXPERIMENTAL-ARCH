# Fragments servant a synthetiser des noms de famille supplementaires.
#
# Les listes curatives ci-dessus portent les difficultes voulues, mais elles ne
# suffisent pas a remplir un catalogue de 1 200 praticiens sans repeter chaque
# nom des dizaines de fois. Or un catalogue ou tous les noms sont partages rend
# toute demande ambigue et la mesure de detection d'ambiguite perd son sens.
# Ces fragments produisent donc des noms distincts et plausibles ; l'ambiguite
# reste concentree la ou elle est choisie.
synthetic_surname_parts:
  prefixes:
    [Val, Mar, Bel, Cour, Fer, Gran, Roch, Vau, Char, Del, Ser, Mont, Beau, Lav,
     Bour, Trem, Nog, Aub, Cast, Fren, Gard, Hal, Jol, Lam, Mer, Nev, Orl, Pav,
     Quen, Riv, Sab, Tour, Ver, Vil, Bref, Cham, Dour, Estr, Fauv, Gonz, Herv,
     Isam, Jard, Kerv, Loub]
  # Toutes les valeurs sont citees : en YAML 1.1, 'on', 'no' et 'y' seraient
  # sinon interpretes comme des booleens.
  suffixes:
    ["bert", "mont", "court", "ville", "gnac", "reau", "teau", "ard", "ange",
     "ier", "eau", "in", "ot", "el", "ay", "ac", "on", "et", "is", "oux",
     "ol", "ans", "ec", "ieu", "af", "ust", "oy", "iel"]

