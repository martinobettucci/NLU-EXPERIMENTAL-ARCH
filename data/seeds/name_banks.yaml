# Groupes que la reconnaissance vocale et l'oreille confondent. Toutes les
# variantes d'un groupe existent dans le catalogue : c'est ce qui rend
# l'ambiguite reelle plutot que theorique, et ce qui permet de mesurer si le
# resolveur demande une clarification au lieu de trancher au hasard.
