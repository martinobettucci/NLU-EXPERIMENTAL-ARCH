[project]
name = "ivr-bench"
version = "0.1.0"
description = "Banc d'essai reproductible pour le routage d'intentions et l'appel de fonctions dans un serveur vocal interactif francophone"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Martino Bettucci", email = "martino.bettucci@gmail.com" }]
keywords = ["function-calling", "intent-routing", "ivr", "benchmark", "on-device"]

# Le coeur du paquet reste installable sans aucun poids de modele : la generation
# de donnees, le backend simule, les metriques et les rapports n'en dependent pas.
# Les modeles reels arrivent par les extras ci-dessous, jamais par un substitut.
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "rapidfuzz>=3.9",
  "jsonschema>=4.23",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "matplotlib>=3.9",
  "structlog>=24.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "psutil>=6.0",
]

[project.optional-dependencies]
# Encodeurs semantiques reels (EmbeddingGemma et comparatif multilingue plus petit).
embeddings = [
  "sentence-transformers>=3.1",
  "transformers>=4.45",
  "torch>=2.4",
  "huggingface-hub>=0.25",
]
# Needle : 26M parametres, encodeur-decodeur JAX, appel d'outils single-shot.
needle = [
  "jax>=0.4.34",
  "needle @ git+https://github.com/cactus-compute/needle@6fdddb874dd6f46dabeea88d0bf239fc4a2474c4",
]
# FunctionGemma 270m-it, zero-shot puis specialise (LoRA sur CPU).
functiongemma = [
  "transformers>=4.45",
  "torch>=2.4",
  "peft>=0.13",
  "accelerate>=1.0",
  "datasets>=3.0",
]
# Pipeline vocal francais : synthese Supertonic, reconnaissance faster-whisper.
audio = [
  "supertonic>=1.3",
  "faster-whisper>=1.1",
  "soundfile>=0.12",
]
# Variante d'index approximatif, comparee a la recherche exacte.
ann = ["faiss-cpu>=1.8"]
dev = [
  "ruff>=0.7",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "types-pyyaml",
  "types-jsonschema",
  "types-psutil",
  "pandas-stubs",
]

[project.scripts]
ivr-bench = "ivr_bench.cli.main:app"

[project.urls]
Repository = "https://github.com/martinobettucci/NLU-EXPERIMENTAL-ARCH"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ivr_bench"]

# Needle est epingle par commit depuis son depot de reference : il n'est pas publie sur PyPI.
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "A",        # builtins shadowing
  "C4",       # comprehensions
  "PTH",      # pathlib plutot que os.path
  "SIM",      # simplifications
  "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003"]  # les chaines francaises contiennent des caracteres unicode voulus

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["ivr_bench"]
exclude = ["src/ivr_bench/routers/diet/sidecar/"]

# Les paquets de modeles n'exposent pas de stubs : on tolere l'import non type,
# jamais l'appel non verifie cote code metier.
[[tool.mypy.overrides]]
module = [
  "sentence_transformers.*",
  "transformers.*",
  "needle.*",
  "jax.*",
  "supertonic.*",
  "faster_whisper.*",
  "faiss.*",
  "sklearn.*",
  "scipy.*",
  "matplotlib.*",
  "soundfile.*",
  "peft.*",
  # Rasa ne vit que dans le sidecar Python 3.10 : l'environnement principal ne
  # l'installe pas, et ne doit pas etre tenu de le typer.
  "rasa.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "models: necessite des poids reels telecharges par 'ivr-bench models download'",
  "slow: campagne longue, exclue des suites rapides",
]

[tool.coverage.run]
source = ["src/ivr_bench"]
branch = true
